[[permission]]
identifier = "allow-app-commands"
description = "Application commands used by the main window. Required for the Vite dev origin as well as the embedded frontend once an app ACL exists."
commands.allow = [
  "get_bluetooth_adapters",
  "scan_bluetooth_devices",
  "get_discovered_bluetooth_devices",
  "start_websocket_server",
  "stop_websocket_server",
  "get_websocket_status",
  "get_channel_intensities",
  "get_axis_values",
  "update_output_options",
  "connect_bluetooth_device",
  "disconnect_bluetooth_device",
  "send_coyote_command",
  "send_device_response",
  "get_device_output",
  "get_connection_status",
  "get_full_state",
  "close_splashscreen",
  "get_app_settings",
  "save_app_settings",
  "save_channel_settings",
  "update_channel_config",
  "save_output_settings",
  "save_connection_settings",
  "get_websocket_port",
  "save_bluetooth_settings",
  "save_shortcuts",
  "save_gamepad_bindings",
  "get_gamepad_bindings",
  "set_gamepad_engine",
  "get_gamepad_status",
  "set_selected_gamepad",
  "set_gamepad_stick_sensitivity",
  "set_gamepad_button_repeat",
  "save_general_settings",
  "set_channel_max_intensity",
  "get_output_paused",
  "set_output_paused",
  "toggle_output_paused",
  "update_parameter_source",
  "update_buttplug_links",
  "get_presets",
  "save_preset",
  "delete_preset",
  "rename_preset",
  "get_log_path",
  "read_logs",
  "start_diagnostic_capture",
  "stop_diagnostic_capture",
  "get_diagnostic_status",
]
